<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo REMBUK">
  <!-- shadow offset khas neobrutalism -->
  <rect x="16" y="16" width="92" height="92" rx="16" fill="#1a1a1a"/>
  <!-- badge utama -->
  <rect x="10" y="10" width="92" height="92" rx="16" fill="#ffd900" stroke="#1a1a1a" stroke-width="6"/>
  <!-- aksen pink di pojok kanan atas -->
  <circle cx="96" cy="20" r="11" fill="#ff90e8" stroke="#1a1a1a" stroke-width="4"/>
  <!-- aksen cyan di pojok kiri bawah -->
  <rect x="10" y="86" width="20" height="20" rx="5" fill="#28ebd4" stroke="#1a1a1a" stroke-width="4" transform="rotate(-8 20 96)"/>
  <!-- monogram R -->
  <text x="50" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="62" fill="#1a1a1a">R</text>
</svg>
